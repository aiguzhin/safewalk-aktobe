<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeWalk — карта безопасности Актобе</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
<style>
  :root{
    color-scheme: light;
    --bg:#0f172a;
    --panel:#ffffff;
    --text:#1e293b;
    --muted:#64748b;
    --accent:#e11d48;
    --primary:#2563eb;
    --light:#f8b400;
    --dogs:#8b5e34;
    --construction:#f97316;
    --forest:#16a34a;
    --other:#6366f1;
    --border:#e2e8f0;
    --ok:#16a34a;
    --err:#dc2626;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{position:relative;width:100%;height:100vh;min-height:480px;}
  #map{position:absolute;inset:0;}
  button{font-family:inherit;}

  header{
    position:absolute; top:0; left:0; right:0; z-index:1000;
    display:flex; align-items:center; gap:10px;
    padding:12px 14px;
    background:linear-gradient(to bottom, rgba(15,23,42,0.92), rgba(15,23,42,0));
    pointer-events:none;
  }
  header .logo{
    pointer-events:auto;
    display:flex; align-items:center; gap:8px;
    background:var(--panel); padding:8px 14px; border-radius:999px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    font-weight:700; font-size:15px; color:var(--text);
  }
  header .logo span.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;}
  #weatherChip{
    pointer-events:auto;
    display:flex; align-items:center; gap:6px;
    background:var(--panel); padding:8px 12px; border-radius:999px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    font-weight:600; font-size:13.5px; color:var(--text);
    white-space:nowrap;
  }
  #weatherChip .ic{font-size:16px;}
  header .sos{
    pointer-events:auto;
    margin-left:auto;
    background:var(--accent); color:#fff; border:none; border-radius:999px;
    font-weight:800; letter-spacing:0.03em; font-size:14px;
    padding:10px 18px; box-shadow:0 4px 14px rgba(225,29,72,0.45);
    cursor:pointer; flex:none;
  }
  header .sos:active{transform:scale(0.97);}

  /* ---- Route panel ---- */
  #routeToggle{
    position:absolute; top:66px; left:14px; z-index:1000;
    background:var(--primary); color:#fff; border:none; border-radius:999px;
    padding:10px 16px; font-weight:700; font-size:13.5px;
    box-shadow:0 4px 14px rgba(37,99,235,0.4); cursor:pointer;
  }
  #routePanel{
    position:absolute; top:66px; left:14px; z-index:1001;
    background:var(--panel); border-radius:16px; padding:14px;
    box-shadow:0 8px 26px rgba(0,0,0,0.28);
    width:290px; max-width:calc(100vw - 28px);
    display:none;
  }
  #routePanel.open{display:block;}
  #routePanel h3{margin:0 0 10px; font-size:14px; display:flex; align-items:center; justify-content:space-between;}
  #routePanel h3 button{background:none;border:none;font-size:16px;cursor:pointer;color:var(--muted);padding:0 4px;}
  .field{position:relative; margin-bottom:8px;}
  .field input{
    width:100%; padding:9px 10px; border-radius:10px; border:1px solid var(--border);
    font-size:13.5px; color:var(--text); background:#f8fafc;
  }
  .field input:focus{outline:2px solid var(--primary); outline-offset:1px;}
  .suggest{
    position:absolute; top:100%; left:0; right:0; z-index:1002;
    background:var(--panel); border:1px solid var(--border); border-top:none;
    border-radius:0 0 10px 10px; max-height:170px; overflow-y:auto;
    box-shadow:0 8px 16px rgba(0,0,0,0.15);
  }
  .suggest div{padding:8px 10px; font-size:12.5px; cursor:pointer; border-bottom:1px solid #f1f5f9;}
  .suggest div:last-child{border-bottom:none;}
  .suggest div:hover, .suggest div.hl{background:#eff6ff;}
  .row2{display:flex; gap:8px; margin-bottom:8px;}
  .row2 button{
    flex:1; border:1px solid var(--border); background:#f8fafc; color:var(--text);
    border-radius:10px; padding:8px 6px; font-size:12px; cursor:pointer;
  }
  #buildRouteBtn{
    width:100%; background:var(--primary); color:#fff; border:none; border-radius:10px;
    padding:10px; font-weight:700; font-size:13.5px; cursor:pointer; margin-top:2px;
  }
  #buildRouteBtn:disabled{opacity:0.6; cursor:default;}
  #routeStatus{margin-top:10px; font-size:12.5px; line-height:1.45;}
  #routeStatus .warn{color:#b45309; font-weight:600;}
  #routeStatus .ok{color:var(--ok); font-weight:600;}
  #routeStatus .err{color:var(--err); font-weight:600;}
  #clearRouteBtn{
    margin-top:8px; width:100%; background:none; border:1px solid var(--border);
    border-radius:10px; padding:7px; font-size:12px; color:var(--muted); cursor:pointer; display:none;
  }

  /* ---- Legend (bottom-right now) ---- */
  #legend{
    position:absolute; right:14px; bottom:14px; z-index:1000;
    background:var(--panel); border-radius:14px; padding:12px 14px;
    box-shadow:0 6px 20px rgba(0,0,0,0.2);
    max-width:200px; font-size:12px; color:var(--text);
  }
  #legend h4{margin:0 0 8px; font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);}
  #legend .row{display:flex; align-items:center; gap:8px; margin-bottom:5px;}
  #legend .row:last-child{margin-bottom:0;}
  #legend .sw{width:11px;height:11px;border-radius:50%;flex:none;}

  #filters{
    position:absolute; right:14px; top:70px; z-index:1000;
    background:var(--panel); border-radius:14px; padding:10px;
    box-shadow:0 6px 20px rgba(0,0,0,0.2);
    display:flex; flex-direction:column; gap:6px; max-width:170px;
  }
  #filters button{
    border:1px solid var(--border); background:#f8fafc; color:var(--text);
    border-radius:10px; padding:7px 9px; font-size:12.5px; text-align:left;
    cursor:pointer; display:flex; align-items:center; gap:8px;
  }
  #filters button.active{background:var(--text); color:#fff; border-color:var(--text);}
  #filters button .sw{width:10px;height:10px;border-radius:50%;flex:none;}

  /* ---- Compass + geolocation (bottom-left) ---- */
  #compassWrap{
    position:absolute; left:14px; bottom:14px; z-index:1000;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  #compass{
    width:66px; height:66px; border-radius:50%; background:var(--panel);
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
    position:relative; cursor:pointer;
  }
  #compass .ring{
    position:absolute; inset:4px; border-radius:50%; border:1px solid var(--border);
  }
  #compass .nlabel{
    position:absolute; top:4px; left:50%; transform:translateX(-50%);
    font-size:9px; font-weight:800; color:var(--accent);
  }
  #compass .needle{
    position:absolute; left:50%; top:50%; width:2px; height:24px;
    background:linear-gradient(to bottom, var(--accent) 0%, var(--accent) 50%, var(--text) 50%, var(--text) 100%);
    transform-origin:50% 100%;
    margin-left:-1px; margin-top:-24px;
    transition:transform 0.3s ease;
  }
  #compass .dot{
    position:absolute; left:50%; top:50%; width:6px; height:6px; margin-left:-3px; margin-top:-3px;
    border-radius:50%; background:var(--text);
  }
  #locateBtn{
    background:var(--panel); border:none; border-radius:999px; width:40px; height:40px;
    box-shadow:0 6px 16px rgba(0,0,0,0.25); cursor:pointer; font-size:17px;
    display:flex; align-items:center; justify-content:center;
  }
  #locateBtn.busy{animation:spin 1s linear infinite;}
  @keyframes spin{ to { transform:rotate(360deg); } }
  #geoStatus{
    font-size:10.5px; color:#fff; background:rgba(15,23,42,0.75); padding:3px 8px;
    border-radius:8px; max-width:150px; text-align:center; display:none;
  }

  .lp{font-size:13.5px; line-height:1.4; min-width:180px;}
  .lp b{display:block; font-size:14px; margin-bottom:2px;}
  .lp .cat{
    display:inline-block; margin-top:6px; padding:2px 8px; border-radius:999px;
    font-size:11px; font-weight:700; color:#fff;
  }
  .lp .time{color:var(--muted); font-size:12px; margin-top:4px;}
  .lp .approx{color:#b45309; font-size:11px; margin-top:4px; font-style:italic;}
  .me-dot{width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 2px rgba(37,99,235,0.5);}

  @media (max-width:560px){
    #filters{max-width:130px; padding:8px; gap:4px;}
    #filters button{padding:5px 7px; font-size:11.5px;}
    #legend{max-width:150px; font-size:11px; padding:10px;}
    header{flex-wrap:wrap; gap:6px;}
    header .logo{font-size:12px; padding:6px 10px;}
    #weatherChip{font-size:11.5px; padding:6px 9px;}
    header .sos{padding:8px 12px; font-size:12px;}
    #routeToggle{top:60px; font-size:12.5px; padding:9px 14px;}
    #routePanel{top:60px; width:calc(100vw - 28px);}
    #compassWrap{bottom:12px; left:10px;}
    #compass{width:52px;height:52px;}
    #compass .needle{height:19px; margin-top:-19px;}
    #locateBtn{width:34px;height:34px;font-size:14px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <header>
    <div class="logo"><span class="dot"></span> SafeWalk · Актобе</div>
    <div id="weatherChip"><span class="ic">…</span><span class="val">—</span></div>
    <button class="sos" id="sosBtn">🆘 SOS</button>
  </header>

  <button id="routeToggle">🧭 Построить маршрут</button>
  <div id="routePanel">
    <h3>Безопасный маршрут <button id="routeCloseBtn" title="Свернуть">✕</button></h3>
    <div class="field">
      <input id="fromInput" type="text" placeholder="Откуда (например: ЦУМ)" autocomplete="off">
      <div class="suggest" id="fromSuggest" hidden></div>
    </div>
    <div class="field">
      <input id="toInput" type="text" placeholder="Куда" autocomplete="off">
      <div class="suggest" id="toSuggest" hidden></div>
    </div>
    <div class="row2">
      <button id="useMyLocBtn">📍 Моё место → «Откуда»</button>
      <button id="swapBtn" title="Поменять местами">⇅</button>
    </div>
    <button id="buildRouteBtn">Построить безопасный маршрут</button>
    <div id="routeStatus"></div>
    <button id="clearRouteBtn">Очистить маршрут</button>
  </div>

  <div id="filters">
    <button data-cat="all" class="active">Все точки</button>
    <button data-cat="light"><span class="sw" style="background:var(--light)"></span>Нет света</button>
    <button data-cat="dogs"><span class="sw" style="background:var(--dogs)"></span>Собаки</button>
    <button data-cat="construction"><span class="sw" style="background:var(--construction)"></span>Стройка</button>
    <button data-cat="forest"><span class="sw" style="background:var(--forest)"></span>Лес/пустырь</button>
    <button data-cat="other"><span class="sw" style="background:var(--other)"></span>Другое</button>
  </div>

  <div id="legend">
    <h4>Категории опасности</h4>
    <div class="row"><span class="sw" style="background:var(--light)"></span>Нет освещения</div>
    <div class="row"><span class="sw" style="background:var(--dogs)"></span>Бродячие собаки</div>
    <div class="row"><span class="sw" style="background:var(--construction)"></span>Стройка</div>
    <div class="row"><span class="sw" style="background:var(--forest)"></span>Лес / пустырь</div>
    <div class="row"><span class="sw" style="background:var(--other)"></span>Другое (криминогенно)</div>
  </div>

  <div id="compassWrap">
    <div id="geoStatus"></div>
    <div id="compass" title="Компас (нажмите, чтобы включить датчик на телефоне)">
      <div class="ring"></div>
      <div class="nlabel">N</div>
      <div class="needle" id="needle"></div>
      <div class="dot"></div>
    </div>
    <button id="locateBtn" title="Определить моё местоположение">📍</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
// ==================================================================
// SafeWalk MVP — Aktobe
// Точки собраны из открытых публикаций местных СМИ и уточнены через
// геокодер OpenStreetMap (Nominatim). Пара точек (Шанхай, Бершугур)
// не имеют точного адреса в OSM — координаты приблизительные, отмечено
// в описании. Замените/дополните реальными ответами вашей Google-формы.
// ==================================================================
const CATEGORY_META = {
  light:        { label: "Нет освещения",  color: "#f8b400", weight: 1 },
  dogs:         { label: "Бродячие собаки", color: "#8b5e34", weight: 2 },
  construction: { label: "Стройка",         color: "#f97316", weight: 2 },
  forest:       { label: "Лес / пустырь",   color: "#16a34a", weight: 1 },
  other:        { label: "Другое",          color: "#6366f1", weight: 3 }
};

const points = [
  { name:"ул. Жыра (быв. Овражная)", cat:"light", lat:50.2789, lon:57.2368,
    desc:"Жители жалуются на отсутствие уличного освещения — вечером «темно как в пещере».",
    time:"вечер/ночь", source:"diapazon.kz — «Актобе во тьме»" },
  { name:"ул. Жангельдина", cat:"light", lat:50.3039, lon:57.2109,
    desc:"Улица без фонарей, отмечена в числе неосвещённых (р-н Курмыш).",
    time:"вечер/ночь", source:"diapazon.kz — «Актобе во тьме»" },
  { name:"Гарнизонный городок (Жилгородок)", cat:"light", lat:50.3122, lon:57.1553,
    desc:"Освещения нет уже много лет, жители неоднократно жаловались.",
    time:"вечер/ночь", source:"diapazon.kz — «Актобе во тьме»" },
  { name:"ул. «30 лет Казахстана»", cat:"light", lat:50.2801, lon:57.2390,
    desc:"Фонари не работают на значительном участке улицы.",
    time:"вечер/ночь", source:"diapazon.kz — «Актобе во тьме»" },
  { name:"ул. Некрасова", cat:"light", lat:50.2892, lon:57.2062,
    desc:"Тёмные участки без уличного освещения.",
    time:"вечер/ночь", source:"diapazon.kz — «Актобе во тьме»" },
  { name:"ул. Котовского (ныне Мусирепова)", cat:"light", lat:50.3149, lon:57.1336,
    desc:"Жители в комментариях жалуются на отсутствие света на улице.",
    time:"вечер/ночь", source:"diapazon.kz — «Актобе во тьме»" },
  { name:"ул. Бершугур", cat:"light", lat:50.2860, lon:57.2150,
    desc:"Улица без освещения, попала в список проблемных.",
    time:"вечер/ночь", source:"diapazon.kz — «Актобе во тьме»", approx:true },
  { name:"ул. Коктем (быв. Весенняя)", cat:"light", lat:50.2657, lon:57.2440,
    desc:"Нет освещения рядом со школой №13 и старым кладбищем — «у акимата денег нет».",
    time:"вечер/ночь", source:"aktobetimes.kz" },
  { name:"Микрорайон Шанхай", cat:"other", lat:50.2900, lon:57.2600,
    desc:"«Традиционно опасный район», по вечерам орудуют группы хулиганов.",
    time:"вечер", source:"diapazon.kz — «Почему опасно ходить вечером по Актобе»", approx:true },
  { name:"Район «Акация»", cat:"other", lat:50.2814, lon:57.2262,
    desc:"По выходным всплеск мошенничества и уличных краж.",
    time:"выходные, вечер", source:"diapazon.kz — «Почему опасно ходить вечером по Актобе»" },
  { name:"5-й микрорайон / пр. Абилкайыр хана", cat:"other", lat:50.2827, lon:57.1905,
    desc:"Один из лидеров по числу краж и хулиганств в частном секторе.",
    time:"вечер/ночь", source:"aktobetimes.kz — «Выявлены наиболее опасные районы»" },
  { name:"ул. Газизы Жубановой", cat:"other", lat:50.2871, lon:57.1810,
    desc:"Зафиксированы кражи, грабежи и тяжкие телесные повреждения.",
    time:"вечер/ночь", source:"aktobetimes.kz — «Выявлены наиболее опасные районы»" },
  { name:"11-й микрорайон", cat:"other", lat:50.3143, lon:57.3301,
    desc:"Высокие показатели краж и грабежей среди многоэтажной застройки.",
    time:"вечер/ночь", source:"aktobetimes.kz — «Выявлены наиболее опасные районы»" },
  { name:"12-й микрорайон (активная застройка)", cat:"construction", lat:50.3110, lon:57.3260,
    desc:"Действующие стройплощадки, плохое освещение подъездов и дворов.",
    time:"вечер", source:"общие данные по застройке района" },
  { name:"Гормолзавод (ГМЗ)", cat:"dogs", lat:50.2619, lon:57.2511,
    desc:"Стаи бродячих собак пугают детей рядом со школой.",
    time:"утро/вечер", source:"newtimes.kz — «Наводят ужас на детей»" },
  { name:"Стройплощадка в Старом городе", cat:"dogs", lat:50.2850, lon:57.2320,
    desc:"Недострой в квартале жилого комплекса — ребёнка едва не покусали собаки по пути в школу.",
    time:"утро", source:"newtimes.kz — «Наводят ужас на детей»", approx:true },
  { name:"Парк им. Первого Президента", cat:"forest", lat:50.2874, lon:57.1865,
    desc:"Центральный парк требует реконструкции — тёмные аллеи, вечером малолюдно.",
    time:"вечер", source:"diapazon.kz — «Парк в центре Актобе полностью обновят»" },
  { name:"Кирпичный (дорога на Акжар-2)", cat:"forest", lat:50.3138, lon:57.2397,
    desc:"Неосвещённый участок дороги через лесополосу на окраине города.",
    time:"вечер/ночь", source:"diapazon.kz — «Актобе во тьме» (комментарии жителей)" }
];

const AKTOBE_CENTER = [50.2837, 57.2298];

// ---------- Map init ----------
const map = L.map('map', { zoomControl: true }).setView(AKTOBE_CENTER, 12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

function makeIcon(color){
  return L.divIcon({
    className: '',
    html: `<div style="width:22px;height:22px;border-radius:50% 50% 50% 0;background:${color};
            transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.4);"></div>`,
    iconSize: [22,22], iconAnchor: [11,22], popupAnchor: [0,-20]
  });
}

const markers = points.map(p => {
  const meta = CATEGORY_META[p.cat];
  const marker = L.marker([p.lat, p.lon], { icon: makeIcon(meta.color) });
  marker.bindPopup(`
    <div class="lp">
      <b>${p.name}</b>
      ${p.desc}
      <div class="time">🕒 Опасно: ${p.time}</div>
      <span class="cat" style="background:${meta.color}">${meta.label}</span>
      <div class="time">Источник: ${p.source}</div>
      ${p.approx ? '<div class="approx">⚠ Точный адрес уточняется — координаты приблизительные</div>' : ''}
    </div>
  `);
  marker.category = p.cat;
  marker.addTo(map);
  return marker;
});

function fitToPoints(){
  try {
    map.invalidateSize();
    const bounds = L.latLngBounds(points.map(p => [p.lat, p.lon]));
    map.fitBounds(bounds.pad(0.25));
  } catch(e) { /* keep default view */ }
}
fitToPoints();
setTimeout(fitToPoints, 300);
window.addEventListener('load', fitToPoints);

document.querySelectorAll('#filters button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const cat = btn.dataset.cat;
    markers.forEach(m => {
      const show = cat === 'all' || m.category === cat;
      if (show) { if (!map.hasLayer(m)) m.addTo(map); }
      else { if (map.hasLayer(m)) map.removeLayer(m); }
    });
  });
});

document.getElementById('sosBtn').addEventListener('click', () => {
  alert('В полной версии SafeWalk эта кнопка мгновенно отправит вашу геолокацию выбранным контактам и/или в экстренные службы. В MVP это заглушка для демонстрации.');
});

// ---------- Weather ----------
const WMO = {
  0:["☀️","Ясно"], 1:["🌤️","Малооблачно"], 2:["⛅","Переменная облачность"], 3:["☁️","Пасмурно"],
  45:["🌫️","Туман"], 48:["🌫️","Изморозь"],
  51:["🌦️","Морось"], 53:["🌦️","Морось"], 55:["🌧️","Сильная морось"],
  61:["🌧️","Небольшой дождь"], 63:["🌧️","Дождь"], 65:["🌧️","Сильный дождь"],
  66:["🌧️","Ледяной дождь"], 67:["🌧️","Ледяной дождь"],
  71:["🌨️","Небольшой снег"], 73:["🌨️","Снег"], 75:["❄️","Сильный снег"], 77:["❄️","Снежные зёрна"],
  80:["🌦️","Ливень"], 81:["🌧️","Ливень"], 82:["⛈️","Сильный ливень"],
  85:["🌨️","Снегопад"], 86:["❄️","Сильный снегопад"],
  95:["⛈️","Гроза"], 96:["⛈️","Гроза с градом"], 99:["⛈️","Сильная гроза с градом"]
};

async function loadWeather(lat, lon){
  const chip = document.getElementById('weatherChip');
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('bad response');
    const data = await res.json();
    const cw = data.current_weather;
    if (!cw) throw new Error('no current_weather');
    const [emoji, label] = WMO[cw.weathercode] || ["🌡️","Погода"];
    chip.querySelector('.ic').textContent = emoji;
    chip.querySelector('.val').textContent = Math.round(cw.temperature) + '°C';
    chip.title = label + ' · Open-Meteo';
  } catch(e) {
    chip.querySelector('.ic').textContent = '🌡️';
    chip.querySelector('.val').textContent = '—';
    chip.title = 'Погода недоступна';
  }
}
loadWeather(AKTOBE_CENTER[0], AKTOBE_CENTER[1]);

// ---------- Compass ----------
const needle = document.getElementById('needle');
const compassEl = document.getElementById('compass');
let compassActive = false;

function applyHeading(alphaDeg){
  // alpha grows counter-clockwise in DeviceOrientationEvent; rotate needle to point "north"
  const heading = (360 - alphaDeg) % 360;
  needle.style.transform = `rotate(${heading}deg)`;
}

function startCompass(){
  if (compassActive) return;
  if (typeof DeviceOrientationEvent === 'undefined') return;
  const handler = (e) => {
    let alpha = null;
    if (typeof e.webkitCompassHeading === 'number') { alpha = 360 - e.webkitCompassHeading; }
    else if (e.absolute && e.alpha != null) { alpha = e.alpha; }
    else if (e.alpha != null) { alpha = e.alpha; }
    if (alpha != null) applyHeading(alpha);
  };
  window.addEventListener('deviceorientationabsolute', handler, true);
  window.addEventListener('deviceorientation', handler, true);
  compassActive = true;
}

compassEl.addEventListener('click', async () => {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const perm = await DeviceOrientationEvent.requestPermission();
      if (perm === 'granted') startCompass();
    } else {
      startCompass();
    }
  } catch(e) { /* sensors unavailable (e.g. desktop) — компас остаётся статичным на север */ }
});

// ---------- Geolocation ----------
let meMarker = null, meCircle = null;
const geoStatus = document.getElementById('geoStatus');
function showGeoStatus(msg, ms){
  geoStatus.textContent = msg;
  geoStatus.style.display = 'block';
  if (ms) setTimeout(() => { geoStatus.style.display = 'none'; }, ms);
}

function locateMe(onSuccess){
  const btn = document.getElementById('locateBtn');
  if (!navigator.geolocation) {
    showGeoStatus('Геолокация не поддерживается браузером', 4000);
    return;
  }
  btn.classList.add('busy');
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      btn.classList.remove('busy');
      const { latitude, longitude, accuracy } = pos.coords;
      if (meMarker) map.removeLayer(meMarker);
      if (meCircle) map.removeLayer(meCircle);
      meMarker = L.marker([latitude, longitude], {
        icon: L.divIcon({ className:'', html:'<div class="me-dot"></div>', iconSize:[16,16], iconAnchor:[8,8] })
      }).addTo(map);
      meCircle = L.circle([latitude, longitude], { radius: accuracy || 50, color:'#2563eb', weight:1, fillOpacity:0.08 }).addTo(map);
      map.setView([latitude, longitude], 15);
      showGeoStatus('Местоположение найдено', 2500);
      loadWeather(latitude, longitude);
      if (onSuccess) onSuccess(latitude, longitude);
    },
    (err) => {
      btn.classList.remove('busy');
      let msg = 'Не удалось определить местоположение';
      if (err.code === 1) msg = 'Доступ к геолокации запрещён';
      if (err.code === 3) msg = 'Истекло время ожидания геолокации';
      showGeoStatus(msg, 4000);
    },
    { enableHighAccuracy:true, timeout:10000, maximumAge:60000 }
  );
}

document.getElementById('locateBtn').addEventListener('click', () => locateMe());

// ---------- Autocomplete (Nominatim) ----------
const AKTOBE_VIEWBOX = '57.05,50.35,57.45,50.15'; // left,top,right,bottom
let fromCoord = null, toCoord = null;
let debounceTimers = {};

function debounceCall(key, fn, delay){
  clearTimeout(debounceTimers[key]);
  debounceTimers[key] = setTimeout(fn, delay);
}

async function searchPlaces(query){
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&viewbox=${AKTOBE_VIEWBOX}&bounded=1&accept-language=ru&q=${encodeURIComponent(query + ', Актобе')}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('geocoder error');
  return res.json();
}

function wireAutocomplete(inputId, suggestId, onPick){
  const input = document.getElementById(inputId);
  const suggest = document.getElementById(suggestId);
  input.addEventListener('input', () => {
    const q = input.value.trim();
    if (input.dataset.lat) { delete input.dataset.lat; delete input.dataset.lon; }
    if (q.length < 3) { suggest.hidden = true; suggest.innerHTML=''; return; }
    debounceCall(inputId, async () => {
      try {
        const results = await searchPlaces(q);
        if (!results.length) { suggest.innerHTML = '<div style="color:#94a3b8">Ничего не найдено</div>'; suggest.hidden = false; return; }
        suggest.innerHTML = '';
        results.forEach(r => {
          const div = document.createElement('div');
          div.textContent = r.display_name;
          div.addEventListener('click', () => {
            input.value = r.display_name.split(',').slice(0,3).join(',');
            input.dataset.lat = r.lat; input.dataset.lon = r.lon;
            suggest.hidden = true;
            onPick(parseFloat(r.lat), parseFloat(r.lon));
          });
          suggest.appendChild(div);
        });
        suggest.hidden = false;
      } catch(e) {
        suggest.innerHTML = '<div style="color:#dc2626">Сервис поиска недоступен</div>';
        suggest.hidden = false;
      }
    }, 450);
  });
  document.addEventListener('click', (e) => {
    if (!suggest.contains(e.target) && e.target !== input) suggest.hidden = true;
  });
}

wireAutocomplete('fromInput', 'fromSuggest', (lat, lon) => { fromCoord = L.latLng(lat, lon); });
wireAutocomplete('toInput', 'toSuggest', (lat, lon) => { toCoord = L.latLng(lat, lon); });

document.getElementById('useMyLocBtn').addEventListener('click', () => {
  locateMe((lat, lon) => {
    fromCoord = L.latLng(lat, lon);
    document.getElementById('fromInput').value = 'Моё местоположение';
  });
});

document.getElementById('swapBtn').addEventListener('click', () => {
  const fromInput = document.getElementById('fromInput');
  const toInput = document.getElementById('toInput');
  const tmpVal = fromInput.value; fromInput.value = toInput.value; toInput.value = tmpVal;
  const tmpCoord = fromCoord; fromCoord = toCoord; toCoord = tmpCoord;
});

// ---------- Routing + safety scoring ----------
let routeLayers = [];
function clearRoute(){
  routeLayers.forEach(l => map.removeLayer(l));
  routeLayers = [];
  document.getElementById('routeStatus').innerHTML = '';
  document.getElementById('clearRouteBtn').style.display = 'none';
}
document.getElementById('clearRouteBtn').addEventListener('click', clearRoute);

function metersBetween(a, b){
  return a.distanceTo(b);
}
// расстояние от точки до отрезка (в метрах), через локальную проекцию
function pointToSegmentMeters(p, a, b){
  const refLat = (a.lat + b.lat) / 2 * Math.PI / 180;
  const R = 6371000;
  const toXY = (pt) => [ R*(pt.lng*Math.PI/180)*Math.cos(refLat), R*(pt.lat*Math.PI/180) ];
  const [px,py] = toXY(p), [ax,ay] = toXY(a), [bx,by] = toXY(b);
  const dx = bx-ax, dy = by-ay;
  const len2 = dx*dx+dy*dy;
  let t = len2 === 0 ? 0 : ((px-ax)*dx + (py-ay)*dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t*dx, cy = ay + t*dy;
  return Math.hypot(px-cx, py-cy);
}

function scoreRouteAgainstDangers(latlngs, thresholdM){
  let score = 0;
  const near = [];
  points.forEach(p => {
    const pll = L.latLng(p.lat, p.lon);
    let minDist = Infinity;
    for (let i=0;i<latlngs.length-1;i++){
      const d = pointToSegmentMeters(pll, latlngs[i], latlngs[i+1]);
      if (d < minDist) minDist = d;
    }
    if (minDist <= thresholdM){
      const w = CATEGORY_META[p.cat].weight;
      score += w * (minDist <= thresholdM/2 ? 1.5 : 1);
      near.push(p);
    }
  });
  return { score, near };
}

async function fetchRoutes(from, to){
  const url = `https://routing.openstreetmap.de/routed-foot/route/v1/foot/${from.lng},${from.lat};${to.lng},${to.lat}?geometries=geojson&overview=full&alternatives=true`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('routing service error');
  const data = await res.json();
  if (data.code !== 'Ok' || !data.routes || !data.routes.length) throw new Error('no route found');
  return data.routes.map(r => ({
    distance: r.distance, duration: r.duration,
    latlngs: r.geometry.coordinates.map(c => L.latLng(c[1], c[0]))
  }));
}

function fmtDist(m){ return m >= 1000 ? (m/1000).toFixed(1)+' км' : Math.round(m)+' м'; }
function fmtDur(s){ const min = Math.round(s/60); return min < 1 ? '<1 мин' : min+' мин'; }

document.getElementById('buildRouteBtn').addEventListener('click', async () => {
  const statusEl = document.getElementById('routeStatus');
  const btn = document.getElementById('buildRouteBtn');
  if (!fromCoord || !toCoord) {
    statusEl.innerHTML = '<span class="err">Выберите адреса «Откуда» и «Куда» из списка подсказок</span>';
    return;
  }
  clearRoute();
  btn.disabled = true;
  statusEl.innerHTML = 'Строим маршрут…';
  try {
    const routes = await fetchRoutes(fromCoord, toCoord);
    const THRESHOLD = 120; // метров
    const scored = routes.map(r => Object.assign(r, scoreRouteAgainstDangers(r.latlngs, THRESHOLD)));
    let safest = scored[0];
    scored.forEach(r => { if (r.score < safest.score || (r.score === safest.score && r.distance < safest.distance)) safest = r; });
    const fastest = scored[0];

    // рисуем альтернативные (серые) маршруты
    scored.forEach(r => {
      if (r === safest) return;
      const l = L.polyline(r.latlngs, { color:'#94a3b8', weight:4, opacity:0.6, dashArray:'6 8' }).addTo(map);
      routeLayers.push(l);
    });
    // безопасный маршрут — поверх, зелёным
    const safeLine = L.polyline(safest.latlngs, { color:'#16a34a', weight:5, opacity:0.9 }).addTo(map);
    routeLayers.push(safeLine);

    const startMarker = L.circleMarker(fromCoord, { radius:7, color:'#16a34a', fillColor:'#16a34a', fillOpacity:1 }).addTo(map);
    const endMarker = L.circleMarker(toCoord, { radius:7, color:'#dc2626', fillColor:'#dc2626', fillOpacity:1 }).addTo(map);
    routeLayers.push(startMarker, endMarker);

    map.fitBounds(safeLine.getBounds().pad(0.2));

    const isDifferentFromFastest = safest !== fastest;
    let html = `<span class="ok">✓ Маршрут построен</span><br>`;
    html += `${fmtDist(safest.distance)} · ~${fmtDur(safest.duration)} пешком<br>`;
    if (safest.near.length){
      html += `<span class="warn">⚠ Рядом ${safest.near.length} опасных точек: ${safest.near.map(p=>p.name).join(', ')}</span><br>`;
    } else {
      html += `<span class="ok">Опасных точек рядом не найдено</span><br>`;
    }
    if (isDifferentFromFastest){
      html += `<span style="color:#64748b">Показан не самый короткий, а самый безопасный из ${scored.length} найденных маршрутов (серым — остальные варианты).</span>`;
    } else if (scored.length > 1) {
      html += `<span style="color:#64748b">Самый быстрый маршрут оказался и самым безопасным из ${scored.length} вариантов.</span>`;
    }
    statusEl.innerHTML = html;
    document.getElementById('clearRouteBtn').style.display = 'block';
  } catch(e) {
    statusEl.innerHTML = `<span class="err">Не удалось построить маршрут (сервис недоступен или нет соединения). Попробуйте ещё раз.</span>`;
  } finally {
    btn.disabled = false;
  }
});
