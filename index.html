<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SafeWalk — карта безопасности Актобе</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
<style>
  :root{
    color-scheme: light;
    --bg:#0f172a;
    --panel:#ffffff;
    --text:#1e293b;
    --muted:#64748b;
    --accent:#e11d48;
    --primary:#2563eb;
    --bike:#0891b2;
    --car:#7c3aed;
    --light:#f8b400;
    --dogs:#8b5e34;
    --construction:#f97316;
    --forest:#16a34a;
    --other:#6366f1;
    --border:#e2e8f0;
    --ok:#16a34a;
    --err:#dc2626;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{position:relative;width:100%;height:100vh;min-height:480px;}
  #map{position:absolute;inset:0;}
  button{font-family:inherit;}
  button:focus-visible, input:focus-visible{outline:2px solid var(--primary); outline-offset:1px;}

  header{
    position:absolute; top:0; left:0; right:0; z-index:1000;
    display:flex; align-items:center; gap:10px;
    padding:12px 14px;
    background:linear-gradient(to bottom, rgba(15,23,42,0.92), rgba(15,23,42,0));
    pointer-events:none;
  }
  header .logo{
    pointer-events:auto;
    display:flex; align-items:center; gap:8px;
    background:var(--panel); padding:8px 14px; border-radius:999px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    font-weight:700; font-size:15px; color:var(--text);
  }
  header .logo span.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block;}
  #weatherChip{
    pointer-events:auto;
    display:flex; align-items:center; gap:6px;
    background:var(--panel); padding:8px 12px; border-radius:999px;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
    font-weight:600; font-size:13.5px; color:var(--text);
    white-space:nowrap;
  }
  #weatherChip .ic{font-size:16px;}
  header .sosWrap{pointer-events:auto; margin-left:auto; position:relative; flex:none;}
  header .sos{
    background:var(--accent); color:#fff; border:none; border-radius:999px;
    font-weight:800; letter-spacing:0.03em; font-size:14px;
    padding:10px 18px; box-shadow:0 4px 14px rgba(225,29,72,0.45);
    cursor:pointer;
  }
  header .sos:active{transform:scale(0.97);}
  #sosMenu{
    position:absolute; top:calc(100% + 8px); right:0; z-index:1002;
    background:var(--panel); border-radius:14px; padding:8px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    width:250px; max-width:calc(100vw - 28px);
    opacity:0; transform:translateY(-6px) scale(0.98); pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  #sosMenu.open{opacity:1; transform:translateY(0) scale(1); pointer-events:auto;}
  #sosMenu .sosItem{
    display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    background:none; border:none; border-radius:10px; padding:10px 10px;
    font-size:13px; color:var(--text); cursor:pointer; text-decoration:none;
  }
  #sosMenu .sosItem:hover{background:#f1f5f9;}
  #sosMenu .sosItem.call{color:var(--accent); font-weight:700;}
  #sosMenu .hint{padding:6px 10px 2px; font-size:11px; color:var(--muted);}

  /* ---- Route toggle + panel ---- */
  #routeToggle{
    position:absolute; top:66px; left:14px; z-index:1000;
    background:var(--primary); color:#fff; border:none; border-radius:999px;
    padding:10px 16px; font-weight:700; font-size:13.5px;
    box-shadow:0 4px 14px rgba(37,99,235,0.4); cursor:pointer;
    transition:transform .15s ease;
  }
  #routeToggle:active{transform:scale(0.96);}
  #routePanel{
    position:absolute; top:66px; left:14px; z-index:1001;
    background:var(--panel); border-radius:18px; padding:14px;
    box-shadow:0 8px 26px rgba(0,0,0,0.28);
    width:300px; max-width:calc(100vw - 28px);
    max-height:calc(100vh - 90px); overflow-y:auto;
    opacity:0; transform:translateY(14px); pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  #routePanel.open{opacity:1; transform:translateY(0); pointer-events:auto;}
  #routePanel .sheetHandle{display:none;}
  #routePanel h3{margin:0 0 10px; font-size:14.5px; display:flex; align-items:center; justify-content:space-between;}
  #routePanel h3 button{background:none;border:none;font-size:17px;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:8px;}
  #routePanel h3 button:hover{background:#f1f5f9;}

  /* Mode switch */
  .modeSwitch{display:flex; gap:6px; background:#f1f5f9; border-radius:12px; padding:4px; margin-bottom:10px;}
  .modeSwitch button{
    flex:1; border:none; background:none; border-radius:9px; padding:8px 4px;
    font-size:18px; cursor:pointer; color:var(--muted); position:relative;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    transition:background .15s ease, color .15s ease;
  }
  .modeSwitch button .mlabel{font-size:9.5px; font-weight:700;}
  .modeSwitch button.active{background:var(--panel); color:var(--text); box-shadow:0 2px 6px rgba(0,0,0,0.12);}

  .field{position:relative; margin-bottom:8px;}
  .field input{
    width:100%; padding:10px 32px 10px 10px; border-radius:10px; border:1px solid var(--border);
    font-size:13.5px; color:var(--text); background:#f8fafc;
  }
  .field input:focus{outline:2px solid var(--primary); outline-offset:1px;}
  .field .clearField{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer;
    width:22px; height:22px; border-radius:50%; display:none; align-items:center; justify-content:center;
  }
  .field.hasVal .clearField{display:flex;}
  .field .clearField:hover{background:#e2e8f0;}
  .suggest{
    position:absolute; top:100%; left:0; right:0; z-index:1002;
    background:var(--panel); border:1px solid var(--border); border-top:none;
    border-radius:0 0 10px 10px; max-height:170px; overflow-y:auto;
    box-shadow:0 8px 16px rgba(0,0,0,0.15);
  }
  .suggest div{padding:8px 10px; font-size:12.5px; cursor:pointer; border-bottom:1px solid #f1f5f9;}
  .suggest div:last-child{border-bottom:none;}
  .suggest div:hover, .suggest div.hl{background:#eff6ff;}
  .spinner{
    width:12px;height:12px;border:2px solid #cbd5e1;border-top-color:var(--primary);
    border-radius:50%;display:inline-block;animation:spin .6s linear infinite;
    margin-right:6px;vertical-align:middle;
  }

  .row2{display:flex; gap:8px; margin-bottom:8px;}
  .row2 button{
    flex:1; border:1px solid var(--border); background:#f8fafc; color:var(--text);
    border-radius:10px; padding:8px 6px; font-size:12px; cursor:pointer;
  }
  .row2 button:active{background:#eef2f7;}

  .favRow{display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap;}
  .favChip{
    display:flex; align-items:center; gap:5px;
    border:1px dashed var(--border); background:#f8fafc; color:var(--muted);
    border-radius:999px; padding:6px 10px; font-size:11.5px; cursor:pointer;
    max-width:100%;
  }
  .favChip.saved{border-style:solid; color:var(--text); background:#eef2ff; border-color:#c7d2fe;}
  .favChip .lbl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:110px;}
  .favChip .rm{color:var(--muted); font-size:12px; margin-left:2px;}
  .favChip .rm:hover{color:var(--err);}

  .recentWrap{margin-bottom:8px;}
  .recentWrap .rtitle{font-size:11px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .recentRow{display:flex; gap:6px; overflow-x:auto; padding-bottom:2px;}
  .recentChip{
    flex:none; border:1px solid var(--border); background:#f8fafc; color:var(--text);
    border-radius:10px; padding:6px 9px; font-size:11px; cursor:pointer; white-space:nowrap;
  }
  .recentChip:hover{background:#eef2f7;}

  #buildRouteBtn{
    width:100%; background:var(--primary); color:#fff; border:none; border-radius:10px;
    padding:11px; font-weight:700; font-size:13.5px; cursor:pointer; margin-top:2px;
    transition:transform .1s ease, background .15s ease;
  }
  #buildRouteBtn:disabled{opacity:0.6; cursor:default;}
  #buildRouteBtn:active:not(:disabled){transform:scale(0.98);}
  #routeStatus{margin-top:10px; font-size:12.5px; line-height:1.45;}
  #routeStatus .warn{color:#b45309; font-weight:600;}
  #routeStatus .ok{color:var(--ok); font-weight:600;}
  #routeStatus .err{color:var(--err); font-weight:600;}
  #clearRouteBtn{
    margin-top:8px; width:100%; background:none; border:1px solid var(--border);
    border-radius:10px; padding:7px; font-size:12px; color:var(--muted); cursor:pointer; display:none;
  }

  /* ---- Categories (filter + legend merged) ---- */
  #categoryPanel{
    position:absolute; right:14px; top:70px; z-index:1000;
    background:var(--panel); border-radius:16px; padding:10px;
    box-shadow:0 6px 20px rgba(0,0,0,0.2);
    display:flex; flex-direction:column; gap:4px; max-width:200px;
  }
  #categoryPanel h4{margin:2px 6px 4px; font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);}
  #categoryPanel button{
    border:1px solid transparent; background:none; color:var(--text);
    border-radius:10px; padding:7px 8px; font-size:12.5px; text-align:left;
    cursor:pointer; display:flex; align-items:center; gap:8px;
  }
  #categoryPanel button:hover{background:#f8fafc;}
  #categoryPanel button.active{background:var(--text); color:#fff;}
  #categoryPanel button.active .sw{box-shadow:0 0 0 2px rgba(255,255,255,0.5);}
  #categoryPanel button .sw{width:10px;height:10px;border-radius:50%;flex:none;}
  #categoryPanel button .cnt{margin-left:auto; font-size:10.5px; color:var(--muted);}
  #categoryPanel button.active .cnt{color:rgba(255,255,255,0.75);}

  /* ---- Compass + geolocation (bottom-left) ---- */
  #compassWrap{
    position:absolute; left:14px; bottom:14px; z-index:1000;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  #compass{
    width:66px; height:66px; border-radius:50%; background:var(--panel);
    box-shadow:0 6px 20px rgba(0,0,0,0.25);
    position:relative; cursor:pointer;
  }
  #compass .ring{
    position:absolute; inset:4px; border-radius:50%; border:1px solid var(--border);
  }
  #compass .nlabel{
    position:absolute; top:4px; left:50%; transform:translateX(-50%);
    font-size:9px; font-weight:800; color:var(--accent);
  }
  #compass .needle{
    position:absolute; left:50%; top:50%; width:2px; height:24px;
    background:linear-gradient(to bottom, var(--accent) 0%, var(--accent) 50%, var(--text) 50%, var(--text) 100%);
    transform-origin:50% 100%;
    margin-left:-1px; margin-top:-24px;
    transition:transform 0.3s ease;
  }
  #compass .dot{
    position:absolute; left:50%; top:50%; width:6px; height:6px; margin-left:-3px; margin-top:-3px;
    border-radius:50%; background:var(--text);
  }
  #locateBtn{
    background:var(--panel); border:none; border-radius:999px; width:40px; height:40px;
    box-shadow:0 6px 16px rgba(0,0,0,0.25); cursor:pointer; font-size:17px;
    display:flex; align-items:center; justify-content:center;
  }
  #locateBtn.busy{animation:spin 1s linear infinite;}
  @keyframes spin{ to { transform:rotate(360deg); } }
  #geoStatus{
    font-size:10.5px; color:#fff; background:rgba(15,23,42,0.75); padding:3px 8px;
    border-radius:8px; max-width:150px; text-align:center; display:none;
  }

  #toast{
    position:absolute; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:rgba(15,23,42,0.92); color:#fff; padding:10px 16px; border-radius:12px;
    font-size:12.5px; z-index:2000; box-shadow:0 8px 20px rgba(0,0,0,0.3);
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
    max-width:calc(100vw - 40px); text-align:center;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .lp{font-size:13.5px; line-height:1.4; min-width:180px;}
  .lp b{display:block; font-size:14px; margin-bottom:2px;}
  .lp .cat{
    display:inline-block; margin-top:6px; padding:2px 8px; border-radius:999px;
    font-size:11px; font-weight:700; color:#fff;
  }
  .lp .time{color:var(--muted); font-size:12px; margin-top:4px;}
  .lp .approx{color:#b45309; font-size:11px; margin-top:4px; font-style:italic;}
  .me-dot{width:16px;height:16px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 2px rgba(37,99,235,0.5);}

  @media (max-width:560px){
    #categoryPanel{max-width:150px; padding:8px;}
    #categoryPanel button{padding:6px 7px; font-size:11.5px;}
    header{flex-wrap:wrap; gap:6px;}
    header .logo{font-size:12px; padding:6px 10px;}
    #weatherChip{font-size:11.5px; padding:6px 9px;}
    header .sos{padding:8px 12px; font-size:12px;}
    #routeToggle{top:60px; font-size:12.5px; padding:9px 14px;}

    #routePanel{
      position:fixed;
      top:auto; left:0; right:0; bottom:0; width:100%; max-width:100%;
      border-radius:20px 20px 0 0; max-height:78vh;
      padding:10px 16px calc(16px + env(safe-area-inset-bottom, 0px));
      transform:translateY(100%);
      box-shadow:0 -10px 30px rgba(0,0,0,0.3);
    }
    #routePanel.open{transform:translateY(0);}
    #routePanel .sheetHandle{
      display:block; width:36px; height:4px; border-radius:999px; background:var(--border);
      margin:2px auto 10px;
    }
    #compassWrap{bottom:12px; left:10px;}
    #compass{width:52px;height:52px;}
    #compass .needle{height:19px; margin-top:-19px;}
    #locateBtn{width:34px;height:34px;font-size:14px;}
    #sosMenu{right:14px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <header>
    <div class="logo"><span class="dot"></span> SafeWalk · Актобе</div>
    <div id="weatherChip"><span class="ic">…</span><span class="val">—</span></div>
    <div class="sosWrap">
      <button class="sos" id="sosBtn">🆘 SOS</button>
      <div id="sosMenu">
        <div class="hint">Экстренная помощь</div>
        <a class="sosItem call" href="tel:112">📞 Позвонить 112</a>
        <button class="sosItem" id="sosShareBtn">📍 Отправить моё местоположение</button>
      </div>
    </div>
  </header>

  <button id="routeToggle">🧭 Построить маршрут</button>
  <div id="routePanel">
    <div class="sheetHandle"></div>
    <h3>Безопасный маршрут <button id="routeCloseBtn" title="Свернуть">✕</button></h3>

    <div class="modeSwitch" id="modeSwitch">
      <button data-mode="foot" class="active"><span>🚶</span><span class="mlabel">Пешком</span></button>
      <button data-mode="bike"><span>🚲</span><span class="mlabel">Вело</span></button>
      <button data-mode="car"><span>🚗</span><span class="mlabel">Авто</span></button>
    </div>

    <div class="field" id="fromField">
      <input id="fromInput" type="text" placeholder="Откуда (например: ЦУМ)" autocomplete="off">
      <button class="clearField" data-target="fromInput" title="Очистить">✕</button>
      <div class="suggest" id="fromSuggest" hidden></div>
    </div>
    <div class="field" id="toField">
      <input id="toInput" type="text" placeholder="Куда" autocomplete="off">
      <button class="clearField" data-target="toInput" title="Очистить">✕</button>
      <div class="suggest" id="toSuggest" hidden></div>
    </div>
    <div class="row2">
      <button id="useMyLocBtn">📍 Моё место → «Откуда»</button>
      <button id="swapBtn" title="Поменять местами">⇅</button>
    </div>

    <div class="favRow" id="favRow"></div>
    <div class="recentWrap" id="recentWrap" hidden>
      <div class="rtitle">Недавние маршруты</div>
      <div class="recentRow" id="recentRow"></div>
    </div>

    <button id="buildRouteBtn">Построить безопасный маршрут</button>
    <div id="routeStatus"></div>
    <button id="clearRouteBtn">Очистить маршрут</button>
  </div>

  <div id="categoryPanel">
    <button data-cat="all" class="active">Все точки</button>
    <h4>Категории опасности</h4>
    <button data-cat="light"><span class="sw" style="background:var(--light)"></span>Нет освещения<span class="cnt"></span></button>
    <button data-cat="dogs"><span class="sw" style="background:var(--dogs)"></span>Бродячие собаки<span class="cnt"></span></button>
    <button data-cat="construction"><span class="sw" style="background:var(--construction)"></span>Стройка<span class="cnt"></span></button>
    <button data-cat="forest"><span class="sw" style="background:var(--forest)"></span>Лес / пустырь<span class="cnt"></span></button>
    <button data-cat="other"><span class="sw" style="background:var(--other)"></span>Другое (криминогенно)<span class="cnt"></span></button>
  </div>

  <div id="compassWrap">
    <div id="geoStatus"></div>
    <div id="compass" title="Компас (нажмите, чтобы включить датчик на телефоне)">
      <div class="ring"></div>
      <div class="nlabel">N</div>
      <div class="needle" id="needle"></div>
      <div class="dot"></div>
    </div>
    <button id="locateBtn" title="Определить моё местоположение">📍</button>
  </div>

  <div id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
// ==================================================================
// SafeWalk MVP — Aktobe
// Точки собраны из открытых публикаций местных СМИ и уточнены через
// геокодер OpenStreetMap (Nominatim). Пара точек (Шанхай, Бершугур)
// не имеют точного адреса в OSM — координаты приблизительные, отмечено
// в описании. Замените/дополните реальными ответами вашей Google-формы.
// ==================================================================
const CATEGORY_META = {
  light:        { label: "Нет освещения",  color: "#f8b400", weight: 1 },
  dogs:         { label: "Бродячие собаки", color: "#8b5e34", weight: 2 },
  construction: { label: "Стройка",         color: "#f97316", weight: 2 },
  forest:       { label: "Лес / пустырь",   color: "#16a34a", weight: 1 },
  other:        { label: "Другое",          color: "#6366f1", weight: 3 }
};

const MODE_META = {
  foot: { profile:"foot", seg:"foot",     label:"пешком",       color:"#16a34a", safetyFirst:true  },
  bike: { profile:"bike", seg:"bike",     label:"на велосипеде",color:"#0891b2", safetyFirst:true  },
  car:  { profile:"car",  seg:"driving",  label:"на машине",    color:"#7c3aed", safetyFirst:false }
};
let currentMode = "foot";

const points = [
  { name:"ул. Жыра (быв. Овражная)", cat:"light", lat:50.2789, lon:57.2368,
    desc:"Жители жалуются на отсутствие уличного освещения — вечером «темно как в пещере».",
    time:"вечер/ночь", source:"diapazon.kz — «Актобе во тьме»" },
  { name:"ул. Жангельдина", cat:"light", lat:50.3039, lon:57.2109,
    desc:"Улица без фонарей, отмечена в числе неосвещённых (р-н Курмыш).",
    time:"вечер/ночь", source:"diapazon.kz — «Актобе во тьме»" },
  { name:"Гарнизонный городок (Жилгородок)", cat:"light", lat:50.3122, lon:57.1553,
    desc:"Освещения нет уже много лет, жители неоднократно жаловались.",
    time:"вечер/ночь", source:"diapazon.kz — «Актобе во тьме»" },
  { name:"ул. «30 лет Казахстана»", cat:"light", lat:50.2801, lon:57.2390,
    desc:"Фонари не работают на значительном участке улицы.",
    time:"вечер/ночь", source:"diapazon.kz — «Актобе во тьме»" },
  { name:"ул. Некрасова", cat:"light", lat:50.2892, lon:57.2062,
    desc:"Тёмные участки без уличного освещения.",
    time:"вечер/ночь", source:"diapazon.kz — «Актобе во тьме»" },
  { name:"ул. Котовского (ныне Мусирепова)", cat:"light", lat:50.3149, lon:57.1336,
    desc:"Жители в комментариях жалуются на отсутствие света на улице.",
    time:"вечер/ночь", source:"diapazon.kz — «Актобе во тьме»" },
  { name:"ул. Бершугур", cat:"light", lat:50.2860, lon:57.2150,
    desc:"Улица без освещения, попала в список проблемных.",

// ---------- Compass ----------
const needle = document.getElementById('needle');
const compassEl = document.getElementById('compass');
let compassActive = false;

function applyHeading(alphaDeg){
  // alpha grows counter-clockwise in DeviceOrientationEvent; rotate needle to point "north"
  const heading = (360 - alphaDeg) % 360;
  needle.style.transform = `rotate(${heading}deg)`;
}

function startCompass(){
  if (compassActive) return;
  if (typeof DeviceOrientationEvent === 'undefined') return;
  const handler = (e) => {
    let alpha = null;
    if (typeof e.webkitCompassHeading === 'number') { alpha = 360 - e.webkitCompassHeading; }
    else if (e.absolute && e.alpha != null) { alpha = e.alpha; }
    else if (e.alpha != null) { alpha = e.alpha; }
    if (alpha != null) applyHeading(alpha);
  };
  window.addEventListener('deviceorientationabsolute', handler, true);
  window.addEventListener('deviceorientation', handler, true);
  compassActive = true;
}

compassEl.addEventListener('click', async () => {
  try {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const perm = await DeviceOrientationEvent.requestPermission();
      if (perm === 'granted') startCompass();
    } else {
      startCompass();
    }
  } catch(e) { /* sensors unavailable (e.g. desktop) — компас остаётся статичным на север */ }
});

function locateMe(onSuccess){
  const btn = document.getElementById('locateBtn');
  if (!navigator.geolocation) {
    showGeoStatus('Геолокация не поддерживается браузером', 4000);
    return;
  }
  btn.classList.add('busy');
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      btn.classList.remove('busy');
      const { latitude, longitude, accuracy } = pos.coords;
      if (meMarker) map.removeLayer(meMarker);
      if (meCircle) map.removeLayer(meCircle);
      meMarker = L.marker([latitude, longitude], {
        icon: L.divIcon({ className:'', html:'<div class="me-dot"></div>', iconSize:[16,16], iconAnchor:[8,8] })
      }).addTo(map);
      meCircle = L.circle([latitude, longitude], { radius: accuracy || 50, color:'#2563eb', weight:1, fillOpacity:0.08 }).addTo(map);
      map.setView([latitude, longitude], 15);
      showGeoStatus('Местоположение найдено', 2500);
      loadWeather(latitude, longitude);
      if (onSuccess) onSuccess(latitude, longitude);
    },
    (err) => {
      btn.classList.remove('busy');
      let msg = 'Не удалось определить местоположение';
      if (err.code === 1) msg = 'Доступ к геолокации запрещён';
      if (err.code === 3) msg = 'Истекло время ожидания геолокации';
      showGeoStatus(msg, 4000);
    },
    { enableHighAccuracy:true, timeout:10000, maximumAge:60000 }
  );
}

// ---------- Autocomplete (Nominatim) ----------
const AKTOBE_VIEWBOX = '57.05,50.35,57.45,50.15'; // left,top,right,bottom
let fromCoord = null, toCoord = null;
let lastFocusedField = 'to';
let debounceTimers = {};

function debounceCall(key, fn, delay){
  clearTimeout(debounceTimers[key]);
  debounceTimers[key] = setTimeout(fn, delay);
}

async function searchPlaces(query){
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=5&viewbox=${AKTOBE_VIEWBOX}&bounded=1&accept-language=ru&q=${encodeURIComponent(query + ', Актобе')}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('geocoder error');
  return res.json();
}

function wireAutocomplete(inputId, suggestId, onPick){
  const input = document.getElementById(inputId);
  const suggest = document.getElementById(suggestId);
  input.addEventListener('focus', () => { lastFocusedField = inputId === 'fromInput' ? 'from' : 'to'; });
  input.addEventListener('input', () => {
    updateFieldState(input);
    const q = input.value.trim();
    if (input.dataset.lat) { delete input.dataset.lat; delete input.dataset.lon; }
    if (q.length < 3) { suggest.hidden = true; suggest.innerHTML=''; return; }
    suggest.innerHTML = '<div><span class="spinner"></span>Идёт поиск…</div>';
    suggest.hidden = false;
    debounceCall(inputId, async () => {
      try {
        const results = await searchPlaces(q);
        if (!results.length) { suggest.innerHTML = '<div style="color:#94a3b8">Ничего не найдено</div>'; suggest.hidden = false; return; }
        suggest.innerHTML = '';
        results.forEach(r => {
          const div = document.createElement('div');
          div.textContent = r.display_name;
          div.addEventListener('click', () => {
            input.value = r.display_name.split(',').slice(0,3).join(',');
            input.dataset.lat = r.lat; input.dataset.lon = r.lon;
            suggest.hidden = true;
            updateFieldState(input);
            onPick(parseFloat(r.lat), parseFloat(r.lon));
          });
          suggest.appendChild(div);
        });
        suggest.hidden = false;
      } catch(e) {
        suggest.innerHTML = '<div style="color:#dc2626">Сервис поиска недоступен</div>';
        suggest.hidden = false;
      }
    }, 450);
  });
  document.addEventListener('click', (e) => {
    if (!suggest.contains(e.target) && e.target !== input) suggest.hidden = true;
  });
}

wireAutocomplete('fromInput', 'fromSuggest', (lat, lon) => { fromCoord = L.latLng(lat, lon); });
wireAutocomplete('toInput', 'toSuggest', (lat, lon) => { toCoord = L.latLng(lat, lon); });

const FAV_KEY = 'safewalk_favorites_v1';
const FAV_SLOTS = [
  { key:'home', icon:'🏠', label:'Дом' },
  { key:'work', icon:'💼', label:'Работа' }
];
function loadFavorites(){
  try { return JSON.parse(localStorage.getItem(FAV_KEY)) || {}; } catch(e) { return {}; }
}
function saveFavorites(favs){
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch(e) { /* хранилище недоступно — молча пропускаем */ }
}
function renderFavorites(){
  const favs = loadFavorites();
  const row = document.getElementById('favRow');
  row.innerHTML = '';
  FAV_SLOTS.forEach(slot => {
    const saved = favs[slot.key];
    const chip = document.createElement('button');
    chip.className = 'favChip' + (saved ? ' saved' : '');
    chip.type = 'button';
    if (saved) {
      chip.innerHTML = `<span>${slot.icon}</span><span class="lbl">${saved.label}</span><span class="rm" data-slot="${slot.key}">✕</span>`;
    } else {
      chip.innerHTML = `<span>${slot.icon}</span><span class="lbl">+ ${slot.label}</span>`;
    }
    chip.addEventListener('click', (e) => {
      if (e.target.classList.contains('rm')) {
        e.stopPropagation();
        const f = loadFavorites();
        delete f[slot.key];
        saveFavorites(f);
        renderFavorites();
        showToast(`«${slot.label}» удалено из избранного`);
        return;
      }
      const cur = loadFavorites()[slot.key];
      if (cur) {
        applyToField(lastFocusedField, cur.label, cur.lat, cur.lon);
        showToast(`«${slot.label}» подставлено в поле «${lastFocusedField === 'from' ? 'Откуда' : 'Куда'}»`);
      } else {
        const coord = lastFocusedField === 'from' ? fromCoord : toCoord;
        const inputEl = document.getElementById(lastFocusedField === 'from' ? 'fromInput' : 'toInput');
        if (!coord || !inputEl.value.trim()) {
          showToast('Сначала выберите адрес в поле «Откуда» или «Куда», затем нажмите сюда, чтобы сохранить его');
          return;
        }
        const f = loadFavorites();
        f[slot.key] = { label: inputEl.value.trim(), lat: coord.lat, lon: coord.lng };
        saveFavorites(f);
        renderFavorites();
        showToast(`Сохранено как «${slot.label}»`);
      }
    });
    row.appendChild(chip);
  });
}
function applyToField(field, label, lat, lon){
  const inputEl = document.getElementById(field === 'from' ? 'fromInput' : 'toInput');
  inputEl.value = label;
  updateFieldState(inputEl);
  const ll = L.latLng(lat, lon);
  if (field === 'from') fromCoord = ll; else toCoord = ll;
}

// расстояние от точки до отрезка (в метрах), через локальную проекцию
function pointToSegmentMeters(p, a, b){
  const refLat = (a.lat + b.lat) / 2 * Math.PI / 180;
  const R = 6371000;
  const toXY = (pt) => [ R*(pt.lng*Math.PI/180)*Math.cos(refLat), R*(pt.lat*Math.PI/180) ];
  const [px,py] = toXY(p), [ax,ay] = toXY(a), [bx,by] = toXY(b);
  const dx = bx-ax, dy = by-ay;
  const len2 = dx*dx+dy*dy;
  let t = len2 === 0 ? 0 : ((px-ax)*dx + (py-ay)*dy) / len2;
  t = Math.max(0, Math.min(1, t));
  const cx = ax + t*dx, cy = ay + t*dy;
  return Math.hypot(px-cx, py-cy);
}

function scoreRouteAgainstDangers(latlngs, thresholdM){
  let score = 0;
  const near = [];
  points.forEach(p => {
    const pll = L.latLng(p.lat, p.lon);
    let minDist = Infinity;
    for (let i=0;i<latlngs.length-1;i++){
      const d = pointToSegmentMeters(pll, latlngs[i], latlngs[i+1]);
      if (d < minDist) minDist = d;
    }
    if (minDist <= thresholdM){
      const w = CATEGORY_META[p.cat].weight;
      score += w * (minDist <= thresholdM/2 ? 1.5 : 1);
      near.push(p);
    }
  });
  return { score, near };
}

async function fetchRoutes(from, to, mode){
  const meta = MODE_META[mode];
  const url = `https://routing.openstreetmap.de/routed-${meta.profile}/route/v1/${meta.seg}/${from.lng},${from.lat};${to.lng},${to.lat}?geometries=geojson&overview=full&alternatives=true`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('routing service error');
  const data = await res.json();
  if (data.code !== 'Ok' || !data.routes || !data.routes.length) throw new Error('no route found');
  return data.routes.map(r => ({
    distance: r.distance, duration: r.duration,
    latlngs: r.geometry.coordinates.map(c => L.latLng(c[1], c[0]))
  }));
}

function fmtDist(m){ return m >= 1000 ? (m/1000).toFixed(1)+' км' : Math.round(m)+' м'; }
function fmtDur(s){
  const min = Math.round(s/60);
  if (min < 1) return '<1 мин';
  if (min < 60) return min+' мин';
  const h = Math.floor(min/60), rem = min % 60;
  return rem ? `${h} ч ${rem} мин` : `${h} ч`;
}

async function buildRoute(){
  const statusEl = document.getElementById('routeStatus');
  const btn = document.getElementById('buildRouteBtn');
  if (!fromCoord || !toCoord) {
    statusEl.innerHTML = '<span class="err">Выберите адреса «Откуда» и «Куда» из списка подсказок</span>';
    return;
  }
  clearRoute();
  btn.disabled = true;
  const meta = MODE_META[currentMode];
  statusEl.innerHTML = `Строим маршрут ${meta.label}…`;
  try {
    const routes = await fetchRoutes(fromCoord, toCoord, currentMode);
    const THRESHOLD = 120; // метров
    const scored = routes.map(r => Object.assign(r, scoreRouteAgainstDangers(r.latlngs, THRESHOLD)));

    let chosen;
    if (meta.safetyFirst) {
      chosen = scored[0];
      scored.forEach(r => { if (r.score < chosen.score || (r.score === chosen.score && r.distance < chosen.distance)) chosen = r; });
    } else {
      chosen = scored[0]; // для авто — самый быстрый / рекомендованный маршрут
    }
    const fastest = scored[0];

    // рисуем альтернативные (серые) маршруты
    scored.forEach(r => {
      if (r === chosen) return;
      const l = L.polyline(r.latlngs, { color:'#94a3b8', weight:4, opacity:0.6, dashArray:'6 8' }).addTo(map);
      routeLayers.push(l);
    });
    // выбранный маршрут — поверх, цветом по виду транспорта
    const mainLine = L.polyline(chosen.latlngs, { color:meta.color, weight:5, opacity:0.9 }).addTo(map);
    routeLayers.push(mainLine);

    const startMarker = L.circleMarker(fromCoord, { radius:7, color:meta.color, fillColor:meta.color, fillOpacity:1 }).addTo(map);
    const endMarker = L.circleMarker(toCoord, { radius:7, color:'#dc2626', fillColor:'#dc2626', fillOpacity:1 }).addTo(map);
    routeLayers.push(startMarker, endMarker);

    map.fitBounds(mainLine.getBounds().pad(0.2));

    let html = `<span class="ok">✓ Маршрут построен (${meta.label})</span><br>`;
    html += `${fmtDist(chosen.distance)} · ~${fmtDur(chosen.duration)}<br>`;

    if (meta.safetyFirst) {
      if (chosen.near.length){
        html += `<span class="warn">⚠ Рядом ${chosen.near.length} опасных точек: ${chosen.near.map(p=>p.name).join(', ')}</span><br>`;
      } else {
        html += `<span class="ok">Опасных точек рядом не найдено</span><br>`;
      }
      const isDifferentFromFastest = chosen !== fastest;
      if (isDifferentFromFastest){
        html += `<span style="color:#64748b">Показан не самый короткий, а самый безопасный из ${scored.length} найденных маршрутов (серым — остальные варианты).</span>`;
      } else if (scored.length > 1) {
        html += `<span style="color:#64748b">Самый быстрый маршрут оказался и самым безопасным из ${scored.length} вариантов.</span>`;
      }
    } else {
      html += `<span style="color:#64748b">Показан оптимальный автомобильный маршрут.</span><br>`;
      if (chosen.near.length){
        html += `<span class="warn">ℹ Рядом с маршрутом ${chosen.near.length} опасных точек — актуально, если часть пути вы пройдёте пешком (например, от парковки): ${chosen.near.map(p=>p.name).join(', ')}</span>`;
      }
    }
    statusEl.innerHTML = html;
    document.getElementById('clearRouteBtn').style.display = 'block';

    pushRecent({
      mode: currentMode,
      fromLabel: document.getElementById('fromInput').value.trim() || 'Точка А',
      fromLat: fromCoord.lat, fromLon: fromCoord.lng,
      toLabel: document.getElementById('toInput').value.trim() || 'Точка Б',
      toLat: toCoord.lat, toLon: toCoord.lng,
      ts: Date.now()
    });
  } catch(e) {
    statusEl.innerHTML = `<span class="err">Не удалось построить маршрут (сервис недоступен или нет соединения). Попробуйте ещё раз.</span>`;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById('buildRouteBtn').addEventListener('click', buildRoute);
</script>
</body>
</html>
